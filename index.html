<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#090909">
<title>PipX</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 background:#090909;
 color:#fff;
 font-family:Arial,Helvetica,sans-serif;
 padding-bottom:75px;
}
.app{
 max-width:560px;
 margin:auto;
 padding:16px;
}
header{
 text-align:center;
 padding:10px 0 18px;
}
.logo{
 font-size:32px;
 font-weight:800;
 color:#ffd700;
}
.sub{color:#888;font-size:13px;margin-top:4px}
.page{display:none}
.page.active{display:block}
.card{
 background:#151515;
 border:1px solid #292929;
 border-radius:16px;
 padding:17px;
 margin-bottom:15px;
}
h2{margin:0 0 15px;font-size:20px}
h3{margin:0 0 10px}
label{
 display:block;
 color:#aaa;
 font-size:13px;
 margin:11px 0 6px;
}
input,select,textarea{
 width:100%;
 padding:13px;
 border-radius:10px;
 border:1px solid #3a3a3a;
 background:#222;
 color:#fff;
 font-size:15px;
 outline:none;
}
textarea{min-height:80px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:#ffd700}
button{
 border:0;
 border-radius:10px;
 padding:12px 15px;
 background:#ffd700;
 color:#000;
 font-weight:800;
 font-size:15px;
 cursor:pointer;
}
.full{width:100%;margin-top:14px}
.secondary{
 background:#262626;
 color:#fff;
 border:1px solid #444;
}
.danger{
 background:#d83b3b;
 color:#fff;
}
.green{color:#00d084}
.red{color:#ff5252}
.gray{color:#999}

.nav{
 position:fixed;
 bottom:0;
 left:0;
 right:0;
 z-index:50;
 background:#111;
 border-top:1px solid #292929;
 display:flex;
 justify-content:center;
}
.nav button{
 flex:1;
 max-width:140px;
 background:transparent;
 color:#888;
 border-radius:0;
 padding:12px 4px 10px;
 font-size:11px;
}
.nav button.active{
 color:#ffd700;
 background:#181818;
}
.nav-icon{font-size:18px;display:block;margin-bottom:3px}

.stats{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:10px;
}
.stat{
 background:#202020;
 border-radius:13px;
 padding:15px;
 text-align:center;
}
.stat small{
 display:block;
 color:#888;
 margin-bottom:7px;
}
.stat strong{
 font-size:20px;
 color:#ffd700;
}

.market-header{
 display:flex;
 justify-content:space-between;
 align-items:center;
}
.live{
 color:#00d084;
 font-size:12px;
 font-weight:bold;
}
.tv{
 width:100%;
 overflow:hidden;
 border-radius:12px;
 min-height:70px;
}

.result-grid{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:10px;
 margin-top:15px;
}
.result{
 background:#202020;
 border-radius:12px;
 padding:14px;
 text-align:center;
}
.result small{
 display:block;
 color:#888;
 margin-bottom:6px;
}
.result strong{
 font-size:19px;
 color:#ffd700;
}

.trade{
 background:#1b1b1b;
 border:1px solid #303030;
 border-radius:14px;
 padding:14px;
 margin-top:10px;
}
.trade-top{
 display:flex;
 justify-content:space-between;
 gap:10px;
 margin-bottom:8px;
}
.trade-pair{
 font-size:17px;
 font-weight:bold;
}
.badge{
 padding:4px 8px;
 border-radius:7px;
 font-size:11px;
 font-weight:bold;
}
.win{background:#063d2c;color:#00d084}
.loss{background:#451919;color:#ff6666}
.be{background:#333;color:#bbb}
.trade-row{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:5px;
 color:#aaa;
 font-size:12px;
}
.trade-row b{color:#fff}
.actions{
 display:flex;
 gap:8px;
 margin-top:12px;
}
.actions button{
 flex:1;
 padding:9px;
 font-size:12px;
}

.empty{
 text-align:center;
 color:#777;
 padding:25px 5px;
}
.note{
 color:#777;
 font-size:12px;
 line-height:1.5;
 margin-top:10px;
}

.direction{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:8px;
}
.direction button{
 background:#222;
 color:#aaa;
 border:1px solid #444;
}
.direction button.selected{
 background:#ffd700;
 color:#000;
 border-color:#ffd700;
}

@media(min-width:700px){
 body{padding-bottom:0}
 .nav{
  position:sticky;
  top:0;
  bottom:auto;
  margin-bottom:10px;
  border:1px solid #292929;
  border-radius:12px;
 }
}
</style>
</head>

<body>

<div class="app">

<header>
 <div class="logo">PipX</div>
 <div class="sub">Trading Journal & Risk Management</div>
</header>


<!-- DASHBOARD -->
<section id="dashboard" class="page active">

<div class="card">
 <h2>🏠 Dashboard</h2>

 <div class="stats">

  <div class="stat">
   <small>Total Trades</small>
   <strong id="dTrades">0</strong>
  </div>
