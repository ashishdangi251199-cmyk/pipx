<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PipX</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<header class="header">
    <h1>PipX</h1>
    <p>Risk & Lot Size Calculator</p>
</header>

<div class="container">

<div class="card">

<h2>Risk Calculator</h2>

<label>Risk ($)</label>
<input type="number" id="risk" placeholder="50">

<label>Stop Loss (Pips)</label>
<input type="number" id="sl" placeholder="30">

<label>Risk : Reward</label>
<input type="text" value="1 : 3" disabled>

<button onclick="calculate()">Calculate</button>

<div class="result">

<p>Lot Size :
<span id="lotSize">0.00</span>
</p>

<p>Take Profit :
<span id="tp">0</span> Pips
</p>

<p>Expected Profit :
$
<span id="profit">0</span>
</p>

</div>

</div>

</div>

<script src="app.js"></script>

</body>
</html>
