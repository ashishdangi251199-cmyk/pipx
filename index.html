<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#090909">
  <title>PipX Pro - Complete Suite</title>
  <link rel="stylesheet" href="style.css">
  <!-- Chart.js for Interactive Charts -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

  <!-- HEADER -->
  <header class="top-header">
    <div class="logo">Pip<span>X</span> Pro</div>
    <div class="subtitle">Live Market, Risk Calculator & Smart Journal</div>
  </header>

  <main>

    <!-- DASHBOARD -->
    <section id="dashboard" class="page active">
      <h1>🏠 Dashboard</h1>
      <div class="stats-grid">
        <div class="stat-card">
          <div>Total Trades</div>
          <strong id="totalTrades">0</strong>
        </div>
        <div class="stat-card">
          <div>Win Rate</div>
          <strong id="winRate">0%</strong>
        </div>
        <div class="stat-card">
          <div>Total Pips</div>
          <strong id="totalPips">0</strong>
        </div>
        <div class="stat-card">
          <div>Net P/L</div>
          <strong id="netPL">$0</strong>
        </div>
      </div>

      <!-- PERFORMANCE CHART -->
      <div class="card chart-box">
        <h2>📊 Performance Analytics</h2>
        <canvas id="performanceChart"></canvas>
      </div>
    </section>

    <!-- LIVE MARKET -->
    <section id="market" class="page">
      <div class="card-header">
        <h1>📈 Live Market</h1>
        <span class="live-dot">● LIVE</span>
      </div>

      <div class="tradingview-widget-container">
        <div class="tradingview-widget-container__widget"></div>
        <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-market-quotes.js" async>
        {
          "width": "100%",
          "height": "480",
          "symbolsGroups": [
            {
              "name": "Watchlist",
              "symbols": [
                { "name": "TVC:USOIL", "displayName": "USOILSPOT" },
                { "name": "FX:GBPUSD", "displayName": "GBPUSD" },
                { "name": "FX:EURUSD", "displayName": "EURUSD" },
                { "name": "FX:GBPJPY", "displayName": "GBPJPY" },
                { "name": "FX:AUDUSD", "displayName": "AUDUSD" },
                { "name": "FX:USDJPY", "displayName": "USDJPY" },
                { "name": "FX:NZDUSD", "displayName": "NZDUSD" },
                { "name": "BITSTAMP:BTCUSD", "displayName": "BTCUSD" },
                { "name": "OANDA:XAUUSD", "displayName": "GOLD" }
              ]
            }
          ],
          "showSymbolLogo": true,
          "colorTheme": "dark",
          "isTransparent": false,
          "locale": "en"
        }
        </script>
      </div>
    </section>

    <!-- CALCULATOR -->
    <section id="calculator" class="page">
      <h1>🧮 Custom Lot Calculator</h1>
      <div class="calculator-card">
        <div class="input-group">
          <label>Risk Amount ($)</label>
          <input id="calcRisk" type="number" placeholder="e.g. 60" value="60" oninput="calculateCustomLotSize()">
        </div>
        <div class="input-group">
          <label>Stop Loss (Pips)</label>
          <input id="calcSL" type="number" placeholder="e.g. 10" value="10" oninput="calculateCustomLotSize()">
        </div>
        <button onclick="calculateCustomLotSize()">CALCULATE</button>

        <div class="result-box">
          <div class="result-item">
            <p>Your Lot Size</p>
            <strong id="lotSizeResult" class="green">0.60</strong>
          </div>
          <p class="formula-info">Formula: (Risk ÷ SL Pips) ÷ 10</p>
        </div>
      </div>
    </section>

    <!-- JOURNAL -->
    <section id="journal" class="page">
      <h1>📓 Trading Journal</h1>

      <div class="journal-card form-card">
        <h2 id="formTitle">Add New Trade</h2>
        
        <div class="grid-inputs">
          <div class="input-group">
            <label>Date</label>
            <input id="tradeDate" type="date">
          </div>
          <div class="input-group">
            <label>Pair</label>
            <select id="tradePair">
              <option value="USOILSPOT">USOILSPOT (WTI Oil)</option>
              <option value="GBPUSD">GBPUSD</option>
              <option value="EURUSD">EURUSD</option>
              <option value="GBPJPY">GBPJPY</option>
              <option value="AUDUSD">AUDUSD</option>
              <option value="USDJPY">USDJPY</option>
              <option value="NZDUSD">NZDUSD</option>
              <option value="BTCUSD">BTCUSD</option>
              <option value="GOLD">GOLD</option>
            </select>
          </div>
        </div>

        <div class="grid-inputs">
          <div class="input-group">
            <label>Direction</label>
            <select id="direction">
              <option value="BUY">BUY</option>
              <option value="SELL">SELL</option>
            </select>
          </div>
          <div class="input-group">
            <label>Setup / Strategy</label>
            <input id="setupStrategy" type="text" placeholder="e.g. Breakout, SMC">
          </div>
        </div>

        <div class="grid-inputs">
          <div class="input-group">
            <label>Entry Price</label>
            <input id="entryPrice" type="number" step="any" placeholder="1.3483">
          </div>
          <div class="input-group">
            <label>Risk Amount ($)</label>
            <input id="journalRisk" type="number" step="any" placeholder="60">
          </div>
        </div>

        <div class="grid-inputs">
          <div class="input-group">
            <label>Pips (+/- Gain/Loss)</label>
            <input id="journalPips" type="number" placeholder="Auto / Manual e.g. 20">
          </div>
          <div class="input-group">
            <label>Result</label>
            <select id="result">
              <option value="WIN">WIN</option>
              <option value="LOSS">LOSS</option>
              <option value="BREAKEVEN">BREAKEVEN</option>
            </select>
          </div>
        </div>

        <div class="input-group">
          <label>Screenshot / Chart Link (URL)</label>
          <input id="screenshotUrl" type="url" placeholder="TradingView link or image URL">
        </div>

        <div class="input-group">
          <label>Notes & Observations</label>
          <textarea id="notes" placeholder="Trade setup / mistakes / observations..."></textarea>
        </div>

        <div class="form-actions btn-group">
          <button id="saveBtn" onclick="saveTrade()">Save Trade</button>
          <button id="cancelEditBtn" class="cancel-btn" onclick="cancelEdit()" style="display:none;">Cancel Edit</button>
        </div>
      </div>

      <div class="history-section">
        <div class="history-header">
          <h2>📜 Trade History</h2>
          <button class="export-btn" onclick="exportCSV()">📥 Export CSV</button>
        </div>

        <div class="filter-box">
          <input id="searchPair" type="text" placeholder="🔍 Search Pair (e.g. GOLD)" oninput="renderTrades()">
          <select id="filterResult" onchange="renderTrades()">
            <option value="ALL">All Results</option>
            <option value="WIN">WIN Only</option>
            <option value="LOSS">LOSS Only</option>
            <option value="BREAKEVEN">BREAKEVEN Only</option>
          </select>
        </div>

        <div id="tradeList" class="trade-list-container"></div>
      </div>
    </section>

  </main>

  <!-- BOTTOM NAVIGATION -->
  <nav class="bottom-nav">
    <button onclick="showPage('dashboard')" class="nav-btn active">
      🏠 <span>Dashboard</span>
    </button>
    <button onclick="showPage('market')" class="nav-btn">
      📈 <span>Market</span>
    </button>
    <button onclick="showPage('calculator')" class="nav-btn">
      🧮 <span>Calculator</span>
    </button>
    <button onclick="showPage('journal')" class="nav-btn">
      📓 <span>Journal</span>
    </button>
  </nav>

  <script src="app.js"></script>
</body>
</html>
