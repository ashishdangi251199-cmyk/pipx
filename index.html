<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>PipX Trading Calculator</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
background:#090909;
color:white;
font-family:Arial,sans-serif;
}

.container{
max-width:520px;
margin:auto;
padding:18px;
}

h1{
text-align:center;
margin:8px 0 4px;
}

.sub{
text-align:center;
color:#888;
margin-bottom:18px;
}

.card{
background:#151515;
border:1px solid #292929;
border-radius:16px;
padding:16px;
margin-bottom:16px;
}

h2{
margin-top:0;
font-size:19px;
}

input,select{
width:100%;
padding:13px;
margin-top:6px;
margin-bottom:12px;
background:#222;
color:white;
border:1px solid #444;
border-radius:10px;
font-size:16px;
}

label{
color:#aaa;
font-size:14px;
}

button{
width:100%;
padding:14px;
border:0;
border-radius:10px;
background:#00a86b;
color:white;
font-size:16px;
font-weight:bold;
}

.results{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
margin-top:12px;
}

.box{
background:#202020;
border-radius:12px;
padding:14px;
text-align:center;
}

.box small{
display:block;
color:#888;
margin-bottom:5px;
}

.box strong{
font-size:19px;
}

.green{color:#00d084}
.red{color:#ff5252}

.note{
font-size:12px;
color:#777;
line-height:1.5;
}
</style>
</head>

<body>

<div class="container">

<h1>📊 PipX</h1>
<div class="sub">Forex • Gold • Crypto • Oil</div>

<div class="card">

<h2>📈 Live Market Prices</h2>

<!-- TradingView Ticker Tape -->
<div class="tradingview-widget-container">
<div class="tradingview-widget-container__widget"></div>

<script
type="text/javascript"
src="https://s3.tradingview.com/external-embedding/embed-widget-ticker-tape.js"
async>

{
"symbols":[
{"proName":"FX:GBPUSD","title":"GBPUSD"},
{"proName":"FX:EURUSD","title":"EURUSD"},
{"proName":"FX:GBPJPY","title":"GBPJPY"},
{"proName":"FX:AUDUSD","title":"AUDUSD"},
{"proName":"FX:USDJPY","title":"USDJPY"},
{"proName":"FX:NZDUSD","title":"NZDUSD"},
{"proName":"BITSTAMP:BTCUSD","title":"BTCUSD"},
{"proName":"OANDA:XAUUSD","title":"GOLD"},
{"proName":"TVC:USOIL","title":"USOIL"}
],
"showSymbolLogo":true,
"isTransparent":true,
"displayMode":"adaptive",
"colorTheme":"dark",
"locale":"en"
}

</script>
</div>

</div>


<div class="card">

<h2>🧮 Lot Size + 1:3 TP</h2>

<label>Forex Pair</label>



<label>Entry Price</label>
<input id="entry" type="number" step="any"
placeholder="Example<select id="pair">

<option value="GBPUSD">GBPUSD</option>
<option value="EURUSD">EURUSD</option>
<option value="GBPJPY">GBPJPY</option>
<option value="AUDUSD">AUDUSD</option>
<option value="USDJPY">USDJPY</option>
<option value="NZDUSD">NZDUSD</option>
<option value="BTCUSD">BTCUSD</option>
<option value="XAUUSD">GOLD (XAUUSD)</option>
<option value="USOILSPOT">US OIL</option>

<option value="CUSTOM">+ Custom Pair</option>

</select> 1.34839">

<label>Stop Loss Price</label>
<input id="stop" type="number" step="any"
placeholder="Example 1.34539">

<label>Risk Amount ($)</label>
<input id="risk" type="number" value="10">

<button onclick="calculate()">CALCULATE</button>

<div class="results">

<div class="box">
<small>SL Pips</small>
<strong id="pips">0</strong>
</div>

<div class="box">
<small>Lot Size</small>
<strong id="lot">0.00</strong>
</div>

<div class="box">
<small>1 : 3 TP</small>
<strong id="tp" class="green">0</strong>
</div>

<div class="box">
<small>Risk</small>
<strong id="riskshow">$0</strong>
</div>

</div>

</div>


<div class="card">

<div class="note">

PipX uses TradingView's embedded market display for online prices.
Forex pairs normally use 0.0001 as one pip.
JPY pairs normally use 0.01 as one pip.

</div>

</div>

</div>


<script>

function calculate(){

let pair=document.getElementById("pair").value;

let entry=parseFloat(
document.getElementById("entry").value
);

let stop=parseFloat(
document.getElementById("stop").value
);

let risk=parseFloat(
document.getElementById("risk").value
);

if(
isNaN(entry) ||
isNaN(stop) ||
isNaN(risk)
){
return;
}

let pipSize=pair.includes("JPY")
?0.01
:0.0001;

let distance=Math.abs(entry-stop);

let pips=distance/pipSize;

let pipValue=10;

let lot=risk/(pips*pipValue);

let tp;

if(entry>stop){

tp=entry+(distance*3);

}else{

tp=entry-(distance*3);

}

let decimals=pair.includes("JPY")
?3
:5;

document.getElementById("pips")
.innerText=pips.toFixed(1);

document.getElementById("lot")
.innerText=lot.toFixed(2);

document.getElementById("tp")
.innerText=tp.toFixed(decimals);

document.getElementById("riskshow")
.innerText="$"+risk.toFixed(2);

}

</script>

</body>
</html>
